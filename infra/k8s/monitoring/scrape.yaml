# How Prometheus finds the worker's /metrics.
#
# The worker has no Service anywhere else, and deliberately: nothing routes
# traffic to it, it consumes queues. This one exists only so a scraper has
# something to discover, which is why it is `clusterIP: None` — there is no
# load balancing to do, and a ServiceMonitor wants the individual pod endpoints
# rather than one virtual address. Balancing would give a scraper a random
# replica each interval, and `wea_queue_depth` would appear to jitter between
# pods that are all reporting the same number.
#
# Per-pod is not merely tidier now that the worker also exports `wea_jobs_total`
# and `wea_job_duration_seconds`. Those are counters owned by the process that
# did the work, so each replica's series is its own; a balanced Service would
# hand the scraper a different pod's counter each interval and `rate()` would
# read the difference as a reset, reporting near-zero throughput on a busy
# system.
apiVersion: v1
kind: Service
metadata:
  name: wea-worker-metrics
  labels:
    app.kubernetes.io/name: wea-worker
    app.kubernetes.io/part-of: wea
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wea-worker
  ports:
    - name: health
      port: 3002
      targetPort: health
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wea-worker
  labels:
    app.kubernetes.io/part-of: wea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wea-worker
  namespaceSelector:
    matchNames: [wea]
  endpoints:
    - port: health
      path: /metrics
      # Faster than the 30s default. The command-backlog alert fires after three
      # minutes, and a scrape interval that is a meaningful fraction of the alert
      # window means the alert is deciding on two or three samples.
      interval: 15s
      # A scrape that hangs holds a connection and delays the next one. Shorter
      # than the interval, always.
      scrapeTimeout: 10s
---
# How Prometheus finds the API's /metrics.
#
# Unlike the worker's, this scrapes the Service that already exists for
# traffic — there is no second Service and no second port, because `/metrics`
# is served from the same listener as `/health/live` and `/health/ready`.
#
# `clusterIP: None` is not wanted here either. A ServiceMonitor discovers the
# Endpoints behind a Service, not its virtual address, so every replica is
# scraped individually regardless of how the Service load-balances — which is
# what the counters need: two replicas each serving half the traffic must be
# summed, not sampled.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wea-api
  labels:
    app.kubernetes.io/part-of: wea
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wea-api
  namespaceSelector:
    matchNames: [wea]
  endpoints:
    - port: http
      path: /metrics
      # Matched to the worker's, so the two sides of a request — the API
      # accepting a webhook and the worker draining the queue it filled — line
      # up sample for sample on a dashboard.
      interval: 15s
      scrapeTimeout: 10s
