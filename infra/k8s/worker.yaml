apiVersion: apps/v1
kind: Deployment
metadata:
  name: wea-worker
  labels:
    app.kubernetes.io/name: wea-worker
    app.kubernetes.io/part-of: wea
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: wea-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One at a time, and never below the current count. A worker that goes
      # down mid-job leaves that job to be retried by another — which is safe,
      # because every processor is idempotent — but a retry costs a model call
      # and, on the send path, risks the one duplicate the draft claim exists to
      # prevent. Cheaper to drain properly.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wea-worker
        app.kubernetes.io/part-of: wea
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Much longer than the API's, and the number comes from the work rather
      # than from a convention. `main.ts` calls `enableShutdownHooks()`, so
      # SIGTERM closes the BullMQ workers and lets in-flight jobs finish; the
      # longest of those is an ingest that fetches and analyses a batch of mail.
      # Killed mid-flight, a send job is the one place a reply could go out
      # twice.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/OWNER/wea-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: wea-config
            - secretRef:
                name: wea-secrets
          ports:
            - name: health
              containerPort: 3002
          # The worker serves nothing except these two routes, which exist
          # solely so this Deployment can have probes at all. `ready` checks
          # Postgres and Redis and answers 503 when either is gone, so a worker
          # that cannot consume is taken out of the deployment's ready count
          # rather than sitting there looking healthy. `live` checks only that
          # the process is up — a liveness probe that checked Redis would
          # restart every worker during a Redis blip, and a restarted worker
          # still cannot reach Redis, so it would cost the in-flight jobs and
          # buy nothing.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wea-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wea-worker
# Deliberately no HorizontalPodAutoscaler.
#
# The API scales on CPU because CPU is what a request costs. A worker's load is
# queue depth, and the two are not related: a worker blocked on a slow Gmail
# call uses almost no CPU while the backlog grows, so a CPU autoscaler would
# scale *down* exactly when more consumers were needed. Scaling this correctly
# means reading queue depth from Redis — KEDA's `redis` scaler on the BullMQ
# waiting list — which is a dependency worth adding deliberately rather than
# approximating with the wrong signal. Until then, `replicas` is set by hand and
# is honest about being a fixed number.
