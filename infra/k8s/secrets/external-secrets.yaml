# Where `wea-secrets` actually comes from.
#
# `infra/k8s/config.yaml` ships a Secret full of REPLACE_ME. That is honest as a
# list of what the application needs, and useless as a deployment mechanism: it
# means somebody edits real credentials into a file that lives in a repository,
# and the first time they forget to unstage it the WhatsApp access token is in
# the history forever.
#
# The Terraform module already writes the values it knows — the two database
# URLs, the Redis URL, the KMS key id, the bucket — into a Secrets Manager
# secret, and says so. What was missing was the half that reads them back. These
# manifests are that half: External Secrets pulls the secret into the cluster
# and keeps it in sync, and `config.yaml`'s Secret is deleted rather than
# applied.
#
# Apply this INSTEAD OF the Secret in config.yaml, not alongside it. Two
# controllers owning one object is a fight, and External Secrets loses politely
# by leaving whatever was there.
#
# Requires the External Secrets Operator (external-secrets.io) in the cluster.
# It is not vendored here for the same reason the Terraform does not create a
# cluster: it is a platform decision, and an organisation that uses a different
# one should replace this file rather than work around it.
#
# Every REPLACE_ME below is a `terraform output` from `infra/terraform`:
#
#   REPLACE_ME_REGION    → region
#   REPLACE_ME_ROLE_ARN  → secrets_reader_role_arn
#   REPLACE_ME_PREFIX    → secret_name_prefix
#
# The role is created only when `oidc_provider_arn` is supplied, since its trust
# policy has to name a provider and the module does not create clusters. An
# empty `secrets_reader_role_arn` means that variable was not set.

---
# Authentication is the service account's IAM role, not a stored credential.
#
# The alternative is an access key in a Secret, which is a credential that
# unlocks the credentials — the thing this file exists to remove. `jwt` here
# means IRSA: the pod presents its projected service-account token, STS
# exchanges it for the role, and nothing is stored anywhere.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: wea-aws
  namespace: wea
  labels:
    app.kubernetes.io/part-of: wea
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match where the Terraform module was applied. A wrong region fails
      # with a not-found, which reads like a missing secret rather than a
      # misconfiguration.
      region: REPLACE_ME_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: wea-secrets-reader

---
# The role this binds to needs `secretsmanager:GetSecretValue` on the secret and
# `kms:Decrypt` on the key that encrypts it — the module's own KMS key, since
# that is what `aws_secretsmanager_secret.app` is configured with. Granting the
# first without the second fails at read time with an opaque access-denied,
# which is a long way from the missing statement.
#
# `aws_iam_role.secrets_reader` in the Terraform module grants both, and scopes
# the decrypt with `kms:ViaService` so the role can unwrap what Secrets Manager
# hands it and nothing else — the same key wraps every encrypted column in the
# database.
#
# The service account name here and the one in the role's trust policy have to
# agree. They are `wea-secrets-reader` in the `wea` namespace on both sides; the
# module takes them as variables so a rename changes both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wea-secrets-reader
  namespace: wea
  labels:
    app.kubernetes.io/part-of: wea
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_ME_ROLE_ARN

---
# The values Terraform knows, pulled from the secret it wrote.
#
# `dataFrom` rather than a key-by-key list: the module writes a flat JSON object
# whose keys are already the environment variable names, so enumerating them
# here would be a second copy of the same list to keep in step. Adding a value
# to the secret makes it appear in the cluster with no manifest change.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wea-infrastructure
  namespace: wea
  labels:
    app.kubernetes.io/part-of: wea
spec:
  # Fifteen minutes. The values here change on a Terraform apply, which is rare
  # and deliberate; polling faster buys nothing and every refresh is a billed
  # API call per replica.
  refreshInterval: 15m

  secretStoreRef:
    name: wea-aws
    kind: SecretStore

  target:
    # The same name the Deployments already reference. Nothing in api.yaml or
    # worker.yaml changes.
    name: wea-secrets
    # `Merge` rather than `Owner`: the provider credentials come from the
    # ExternalSecret below, into the same object. `Owner` would make each one
    # delete the other's keys on every refresh.
    creationPolicy: Merge

  dataFrom:
    - extract:
        key: REPLACE_ME_PREFIX/app

---
# The credentials Terraform deliberately does not hold.
#
# Meta, Google, Microsoft and the model provider are things a person typed, and
# the module's own comment says Terraform state is not the place for them. They
# go into a second Secrets Manager secret created out of band, which is why this
# is a separate ExternalSecret rather than another `dataFrom` on the one above:
# the two have different lifecycles and different people touch them.
#
# `DATABASE_URL` is not here and not in the module either. It is the *app* role
# — `wea_app`, the one that cannot bypass row-level security — and its password
# is set when the migration job first runs. Put it in this secret alongside the
# provider credentials.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wea-providers
  namespace: wea
  labels:
    app.kubernetes.io/part-of: wea
spec:
  refreshInterval: 15m

  secretStoreRef:
    name: wea-aws
    kind: SecretStore

  target:
    name: wea-secrets
    creationPolicy: Merge

  dataFrom:
    - extract:
        key: REPLACE_ME_PREFIX/providers
