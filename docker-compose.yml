name: wea

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wea
      POSTGRES_PASSWORD: wea_dev_password
      POSTGRES_DB: wea
      # Deterministic collation so index behaviour matches production.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wea -d wea']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # There was a MinIO here, and a job to create an `wea-attachments` bucket in
  # it. Nothing pointed at either: no S3 client is imported anywhere in this
  # system, and attachment bytes are never stored — an email's file is streamed
  # from the provider, buffered only as long as it takes to hand to Meta, and
  # dropped. `docs/architecture.md` described the storage for several phases
  # anyway.
  #
  # Removed for the same reason the Mailpit below was: a dev machine with a
  # bucket sitting in it looks like a system that stores attachments, and the
  # `S3_*` settings looked like configuration that did something. The settings
  # are now optional and say so; this is the container that made them look real.

  # There was a Mailpit here, described as catching all outbound development
  # mail. Nothing pointed at it: outbound goes through the Gmail and Graph APIs
  # with the user's own OAuth token, in every environment, and there is no SMTP
  # in the send path to intercept. Keeping it meant a dev machine that looked
  # sandboxed and was not, which is the worst version of this to be wrong about.
  # `pnpm preflight` now says so out loud on every run.

  # OpenTelemetry traces + Jaeger UI on :16686.
  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'
    profiles: ['observability']

volumes:
  postgres_data:
  redis_data:
