name: CI

# Two jobs rather than one, and the split is deliberate. `static` fails fast on
# anything that does not need a database; `integration` is the slower job that
# stands up Postgres and proves the things only a real database can prove. Run
# together, a lint error and a broken tenant boundary are two separate red
# marks instead of one, and the second is not hidden behind the first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a branch, never on `main`.
  #
  # On a pull request a superseded run is telling you about code nobody is going
  # to merge, and cancelling it is free. On `main` it is not: main is what gets
  # deployed, so every commit on it needs its own verdict. Two pushes a minute
  # apart would otherwise leave the first one permanently unverified — which is
  # how this was found, by cancelling the run that was validating the manifests
  # in the commit below.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Turbo caches on content, so a job that changed nothing is seconds rather
  # than minutes. Nothing here is a secret.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` is the point of running this in CI at all: it fails
      # when the lockfile does not match package.json, which is the difference
      # between "works on my machine" and a reproducible install.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Before lint and typecheck, because `@wea/db` generates its Prisma client
      # at build time — without it every import of the client is an error that
      # has nothing to do with the change under review.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      # No TEST_DATABASE_URL here, so the database-backed suites skip
      # themselves. That is the ordinary developer experience and it is worth
      # having one job prove it still works.
      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # pgvector, not plain Postgres. The schema declares `vector` columns and
        # an HNSW index; stock postgres:16 fails at the first migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wea
          POSTGRES_PASSWORD: wea_dev_password
          POSTGRES_DB: wea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wea -d wea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Added for the boot tests. `createApplicationContext` runs the worker's
      # lifecycle hooks, so its queue consumers attach to Redis — and "does the
      # worker start at all" is not a question worth answering only on a
      # developer's laptop.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://wea:wea_dev_password@localhost:5432/wea
      REDIS_URL: redis://localhost:6379
      # The restricted role, and the whole reason this job is worth running.
      # Point it at the owner instead and every isolation assertion passes
      # without proving anything, because Postgres exempts the owner from
      # row-level security.
      TEST_DATABASE_URL: postgresql://wea_app:wea_app_password@localhost:5432/wea

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # A service container does not run the init scripts that docker-compose
      # mounts, so the extensions have to be created explicitly. Same file, so
      # the two paths cannot drift.
      - name: Create extensions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/01-extensions.sql

      - name: Migrate
        run: pnpm db:migrate:deploy

      # The migrations create `wea_app` NOLOGIN, which is correct for production
      # and useless for a test that has to connect as it. This grants the
      # development password and refuses to proceed if the role would bypass
      # row-level security.
      - name: Grant the restricted role a login
        run: pnpm db:test-role

      - name: Database integration tests
        run: pnpm --filter @wea/db test:integration

      - name: API integration tests
        run: pnpm --filter @wea/api test:integration

      - name: Worker integration tests
        run: pnpm --filter @wea/worker test:integration

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Schema validation against the real Kubernetes API definitions, which is
      # a different question from "is it valid YAML". A misspelled field is
      # accepted silently by `kubectl apply` — the object is created and the
      # setting simply does not exist — so a typo in `terminationGracePeriod`
      # would produce a worker that is killed mid-job and a manifest that reads
      # as though it is not.
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # The core resources, against the built-in Kubernetes schemas only. `keda/`
      # is excluded because its CRD is not part of Kubernetes, and validating it
      # here would mean passing `-ignore-missing-schemas` — which would also
      # stop a typo'd `kind:` in the Deployments from being caught.
      - name: Validate core resources
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -ignore-filename-pattern 'keda/' \
            -ignore-filename-pattern 'monitoring/' \
            infra/k8s/

      # The KEDA ScaledObject, against the published CRD schema. Worth the extra
      # step: an autoscaler with a misspelled trigger field is accepted by the
      # cluster and then never scales, which looks exactly like a workload that
      # simply is not busy.
      # Both schema sources, because these directories mix custom resources with
      # ordinary ones — the ServiceMonitor needs a Service to scrape. Listing
      # `default` as an additional location is not the same as
      # `-ignore-missing-schemas`: an unknown kind still fails here, it is just
      # resolvable from either source.
      - name: Validate the custom resources
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/k8s/keda/ infra/k8s/monitoring/

      # Schema validation says the PrometheusRule is shaped correctly. It says
      # nothing about whether the PromQL inside it parses — that is a string as
      # far as the schema is concerned, and a malformed expression is accepted
      # by the cluster and then silently never evaluates. promtool is what
      # catches it.
      #
      # What neither tool checks is whether the metric *names* exist in the
      # cluster's Prometheus. Nothing offline can, which is why most of the
      # alerts are written against kube-state-metrics: standard names, no
      # instrumentation in this codebase to keep in step. The exceptions are the
      # queue and API groups, whose names this repository exports itself — and
      # for those the exporters' unit tests assert each name as a literal
      # string, so a rename that would silence an alert fails the test job
      # instead.
      - name: Validate the alert expressions
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 prometheus-2.53.0.linux-amd64/promtool

          # promtool checks a bare rules file; the CRD wraps the same structure
          # under `spec`, so the groups are lifted out first.
          python3 -c "
          import yaml
          d = yaml.safe_load(open('infra/k8s/monitoring/alerts.yaml'))
          yaml.safe_dump({'groups': d['spec']['groups']}, open('/tmp/rules.yaml','w'), sort_keys=False)
          "

          promtool check rules /tmp/rules.yaml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          # The wrapper rewrites stdout to collect outputs and swallows the
          # exit code of the step in the process, which is the opposite of what
          # a check should do.
          terraform_wrapper: false

      - name: Formatting
        run: terraform -chdir=infra/terraform fmt -check -diff

      # `-backend=false` because there is no state to configure here — this
      # downloads the provider schemas, which is the only reason init is needed
      # before validate.
      - name: Init
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      # The step that earns its place. `validate` checks every resource type,
      # every attribute name and every variable reference against the real AWS
      # provider schema — so a misremembered argument is caught here rather than
      # half an hour into an apply, with some resources already created.
      #
      # It cannot run in the environment this was written in: that proxy blocks
      # registry.terraform.io, so `init` fails and `validate` has no schemas to
      # check against. Formatting was all that could be verified there, which is
      # why this job exists.
      - name: Validate
        run: terraform -chdir=infra/terraform validate

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The image smoke check below actually starts the application, and both
    # services connect to their dependencies on the way up. Without these it
    # could only prove the image assembles — which it did, for months, while
    # neither service could boot.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wea
          POSTGRES_PASSWORD: wea_dev_password
          POSTGRES_DB: wea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wea -d wea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      # Both, even when one fails. They share a Dockerfile, so a break in the
      # shared stages shows up in both and a break in one argument shows up in
      # one — which is the difference worth seeing.
      fail-fast: false
      matrix:
        app: [api, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built, not pushed. Nothing here has a registry to push to yet, and a
      # Dockerfile that has never been built is a Dockerfile that does not work —
      # the failure modes are all at build time (a missing manifest in the
      # dependency layer, a generated Prisma client that did not survive the
      # production install) and none of them are visible by reading it.
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node.Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false
          load: true
          tags: wea-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # This step used to override the entrypoint and import one package,
      # under the name "Check the image starts". It did not start anything, and
      # it passed on every run while neither service could boot at all — the
      # exact shape of failure a smoke test exists to prevent.
      #
      # So it now runs the real entrypoint, against real dependencies, and waits
      # for the process to answer its own liveness endpoint. Anything short of
      # that — dependency injection, environment validation, the Prisma client's
      # location after a production install — is something this cannot see.
      - name: Check the image starts
        run: |
          set -euo pipefail

          port=$([ "${{ matrix.app }}" = api ] && echo 3001 || echo 3002)

          # `staging`, not `production`, and the reason is a real gap rather
          # than convenience: the schema forbids KMS_PROVIDER=local in
          # production, and no managed provider is implemented — so there is no
          # production configuration that boots. See docs/status.md. Everything
          # else about the image is identical.
          docker run -d --name smoke --network host \
            -e NODE_ENV=staging \
            -e KMS_PROVIDER=local \
            -e API_PORT=3001 \
            -e WORKER_PORT=3002 \
            -e API_BASE_URL=http://localhost:3001 \
            -e WEB_BASE_URL=http://localhost:3000 \
            -e DATABASE_URL="postgresql://wea:wea_dev_password@localhost:5432/wea" \
            -e REDIS_URL="redis://localhost:6379" \
            -e S3_BUCKET=wea-attachments \
            -e ENCRYPTION_MASTER_KEY="$(head -c 32 /dev/zero | base64 -w0)" \
            -e BLIND_INDEX_KEY="$(head -c 32 /dev/zero | base64 -w0)" \
            -e JWT_ACCESS_SECRET="$(head -c 64 /dev/zero | base64 -w0)" \
            -e JWT_REFRESH_SECRET="$(head -c 64 /dev/zero | base64 -w0)" \
            -e WHATSAPP_PHONE_NUMBER_ID=1234567890 \
            -e WHATSAPP_ACCESS_TOKEN=ci-token \
            -e WHATSAPP_WEBHOOK_VERIFY_TOKEN=ci-verify \
            -e WHATSAPP_APP_SECRET=ci-secret \
            -e AI_PRIMARY_PROVIDER=none \
            wea-${{ matrix.app }}:ci

          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${port}/health/live" >/dev/null 2>&1; then
              echo "${{ matrix.app }} answered /health/live"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::${{ matrix.app }} never answered /health/live"
          docker logs smoke
          docker rm -f smoke >/dev/null
          exit 1
