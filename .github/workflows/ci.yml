name: CI

# Two jobs rather than one, and the split is deliberate. `static` fails fast on
# anything that does not need a database; `integration` is the slower job that
# stands up Postgres and proves the things only a real database can prove. Run
# together, a lint error and a broken tenant boundary are two separate red
# marks instead of one, and the second is not hidden behind the first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a branch, never on `main`.
  #
  # On a pull request a superseded run is telling you about code nobody is going
  # to merge, and cancelling it is free. On `main` it is not: main is what gets
  # deployed, so every commit on it needs its own verdict. Two pushes a minute
  # apart would otherwise leave the first one permanently unverified — which is
  # how this was found, by cancelling the run that was validating the manifests
  # in the commit below.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Turbo caches on content, so a job that changed nothing is seconds rather
  # than minutes. Nothing here is a secret.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Lint, types, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `--frozen-lockfile` is the point of running this in CI at all: it fails
      # when the lockfile does not match package.json, which is the difference
      # between "works on my machine" and a reproducible install.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Before lint and typecheck, because `@wea/db` generates its Prisma client
      # at build time — without it every import of the client is an error that
      # has nothing to do with the change under review.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      # No TEST_DATABASE_URL here, so the database-backed suites skip
      # themselves. That is the ordinary developer experience and it is worth
      # having one job prove it still works.
      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # pgvector, not plain Postgres. The schema declares `vector` columns and
        # an HNSW index; stock postgres:16 fails at the first migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wea
          POSTGRES_PASSWORD: wea_dev_password
          POSTGRES_DB: wea
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wea -d wea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://wea:wea_dev_password@localhost:5432/wea
      # The restricted role, and the whole reason this job is worth running.
      # Point it at the owner instead and every isolation assertion passes
      # without proving anything, because Postgres exempts the owner from
      # row-level security.
      TEST_DATABASE_URL: postgresql://wea_app:wea_app_password@localhost:5432/wea

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # A service container does not run the init scripts that docker-compose
      # mounts, so the extensions have to be created explicitly. Same file, so
      # the two paths cannot drift.
      - name: Create extensions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/01-extensions.sql

      - name: Migrate
        run: pnpm db:migrate:deploy

      # The migrations create `wea_app` NOLOGIN, which is correct for production
      # and useless for a test that has to connect as it. This grants the
      # development password and refuses to proceed if the role would bypass
      # row-level security.
      - name: Grant the restricted role a login
        run: pnpm db:test-role

      - name: Database integration tests
        run: pnpm --filter @wea/db test:integration

      - name: API integration tests
        run: pnpm --filter @wea/api test:integration

      - name: Worker integration tests
        run: pnpm --filter @wea/worker test:integration

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Schema validation against the real Kubernetes API definitions, which is
      # a different question from "is it valid YAML". A misspelled field is
      # accepted silently by `kubectl apply` — the object is created and the
      # setting simply does not exist — so a typo in `terminationGracePeriod`
      # would produce a worker that is killed mid-job and a manifest that reads
      # as though it is not.
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # The core resources, against the built-in Kubernetes schemas only. `keda/`
      # is excluded because its CRD is not part of Kubernetes, and validating it
      # here would mean passing `-ignore-missing-schemas` — which would also
      # stop a typo'd `kind:` in the Deployments from being caught.
      - name: Validate core resources
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.30.0 \
            -schema-location default \
            -ignore-filename-pattern 'keda/' \
            infra/k8s/

      # The KEDA ScaledObject, against the published CRD schema. Worth the extra
      # step: an autoscaler with a misspelled trigger field is accepted by the
      # cluster and then never scales, which looks exactly like a workload that
      # simply is not busy.
      - name: Validate the KEDA ScaledObject
        run: |
          kubeconform -strict -summary \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/k8s/keda/

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Both, even when one fails. They share a Dockerfile, so a break in the
      # shared stages shows up in both and a break in one argument shows up in
      # one — which is the difference worth seeing.
      fail-fast: false
      matrix:
        app: [api, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built, not pushed. Nothing here has a registry to push to yet, and a
      # Dockerfile that has never been built is a Dockerfile that does not work —
      # the failure modes are all at build time (a missing manifest in the
      # dependency layer, a generated Prisma client that did not survive the
      # production install) and none of them are visible by reading it.
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node.Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false
          load: true
          tags: wea-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The build succeeding proves the image assembles. This proves it runs:
      # the entrypoint resolves, every workspace dependency survived the
      # production install, and the Prisma client is where the code expects it.
      # An image that builds and then cannot require its own dependencies is the
      # specific failure a staged build invites.
      - name: Check the image starts
        run: |
          docker run --rm --entrypoint node wea-${{ matrix.app }}:ci \
            -e "import('@wea/db').then(() => console.log('deps resolve'))"
